<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* Example styles for the animations */
        .fadeInDown { /* Add your styles here */ }
        .fadeInUp { /* Add your styles here */ }
        .slideInLeft { /* Add your styles here */ }
        .slideInRight { /* Add your styles here */ }
        .pulse { /* Add your styles here */ }
        .bounce { /* Add your styles here */ }
        .glow { /* Add your styles here */ }
        /* Animation delays */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
    </style>
</head>

<body>
    <header>
        <h1 class="animate__animated animate__fadeInDown">Welcome to My Portfolio</h1>
        <p class="animate__animated animate__slideInLeft delay-1">Location: Kenya</p>
        <p class="animate__animated animate__bounce delay-2">Contact: <a href="tel:+254745207521">+254745207521</a></p>
    </header>
    <main>
        <section>
            <img src="placeholder_avatar.png" alt="Profile Picture" class="animate__animated animate__pulse delay-3">
            <h2 class="animate__animated animate__fadeInUp delay-4">About Me</h2>
            <p class="animate__animated animate__fadeInUp delay-5">Hello! I'm a passionate developer.</p>
        </section>
        <!-- Additional sections with animations as needed -->
    </main>
    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>

</html>
